name: Security Checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build Debug APK for CodeQL
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"

  security-guards:
    name: Security Guards & Dependency Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check pinned dependencies (no dynamic + or SNAPSHOT versions)
        run: |
          if grep -nE '=[[:space:]]*"[^"]*(\+|-SNAPSHOT)"' gradle/libs.versions.toml; then
            echo "::error::Dynamic or SNAPSHOT dependency versions are not allowed."
            exit 1
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run Security Guard & Fuzz Suites
        run: gradle :app:testDebugUnitTest --tests "app.solina.refuge.hardening.*" --tests "app.solina.refuge.autofill.*" --tests "app.solina.refuge.core.sync.*" --stacktrace
