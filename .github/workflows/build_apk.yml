name: Build Solina APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Solina APK
        run: |
          mkdir -p output_apk
          echo "Building Solina Password Manager package..."
          
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"
          
          mkdir -p app_build/res/values
          
          cat << 'MANIFEST' > app_build/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="app.solina.passwordmanager">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <application android:label="Solina Password Manager" android:hasCode="false">
                  <activity android:name="android.app.NativeActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat << 'STRINGS' > app_build/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Solina Password Manager</string>
          </resources>
          STRINGS

          "$BUILD_TOOLS/aapt2" compile --dir app_build/res -o app_build/res.zip
          "$BUILD_TOOLS/aapt2" link -I "$PLATFORM" --manifest app_build/AndroidManifest.xml -o app_build/unsigned.apk app_build/res.zip
          "$BUILD_TOOLS/zipalign" -v -p 4 app_build/unsigned.apk output_apk/Solina-Password-Manager-v1.0.apk
          
          keytool -genkeypair -v -keystore test.keystore -alias solina -keyalg RSA -keysize 2048 -validity 10000 -storepass solina123 -keypass solina123 -dname "CN=Solina, OU=Security, O=SolinaProjects, L=Tehran, C=IR"
          "$BUILD_TOOLS/apksigner" sign --ks test.keystore --ks-pass pass:solina123 --key-pass pass:solina123 output_apk/Solina-Password-Manager-v1.0.apk
          
          echo "APK successfully built and signed!"
          ls -la output_apk/

      - name: Upload Solina Password Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Solina-Password-Manager-Universal-APK
          path: output_apk/Solina-Password-Manager-v1.0.apk
          if-no-files-found: error
          retention-days: 60
