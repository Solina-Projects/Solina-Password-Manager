name: Build Solina APK

on:
  push:
    branches: [main, master, 'preview/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unit tests (TOTP vectors, password generator)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      # Verify the unsigned release variant (R8 and resource shrinking) also builds.
      - name: Build release (unsigned, R8 minified)
        run: gradle :app:assembleRelease --stacktrace

      # Any lint error fails the build.
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Solina-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Lint summary
        if: always()
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$f" ]; then
            echo "== lint findings =="
            grep -E "(Error|Warning): " "$f" | sed 's#.*/passwordmanager/##' | head -80
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  room-instrumentation:
    name: Room transaction instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Room instrumentation tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace
            test_status=$?
            mkdir -p app/build/room-instrumentation-diagnostics
            adb logcat -d -v threadtime > app/build/room-instrumentation-diagnostics/logcat.txt 2>&1 || true
            adb shell dumpsys meminfo > app/build/room-instrumentation-diagnostics/meminfo.txt 2>&1 || true
            adb shell dumpsys activity processes > app/build/room-instrumentation-diagnostics/processes.txt 2>&1 || true
            exit "$test_status"

      - name: Upload Room instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-instrumentation-diagnostics
          path: |
            app/build/room-instrumentation-diagnostics/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
